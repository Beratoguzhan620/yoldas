name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore Yoldas.slnx

      - name: Build
        run: dotnet build Yoldas.slnx --no-restore --configuration Release

      - name: Unit tests
        run: dotnet test tests/Yoldas.UnitTests/Yoldas.UnitTests.csproj --no-build --configuration Release --logger "console;verbosity=normal"

      - name: Integration tests (PostGIS in Testcontainers)
        run: dotnet test tests/Yoldas.IntegrationTests/Yoldas.IntegrationTests.csproj --no-build --configuration Release --logger "console;verbosity=normal"

      - name: Check for model changes without a migration
        run: |
          dotnet tool install --global dotnet-ef --version 10.0.14
          dotnet ef migrations has-pending-model-changes --project src/Yoldas.Infrastructure --startup-project src/Yoldas.Api --no-build --configuration Release
