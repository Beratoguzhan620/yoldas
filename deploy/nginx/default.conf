# Serves the web app and forwards the API and the live feed. One origin, so the browser needs no CORS.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 8080;
    root /usr/share/nginx/html;
    client_max_body_size 1m;

    location ~ ^/(api|scalar|openapi|health)(/|$) {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # The live trip feed: SignalR over WebSockets, kept open for the whole trip.
    location /hubs/ {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        proxy_buffering off;
    }

    # Built files have content hashes in their names, so they can be cached for good.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Everything else is the single-page app. Text from the API is rendered as text; the policy is a second line of
    # defence: scripts and connections only from this origin (WebSockets included), map tiles from OpenStreetMap, no
    # framing. Location only for a driver sharing where the car is, only when they turn it on.
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://tile.openstreetmap.org; font-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self)" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
    }
}
